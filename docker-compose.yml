services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cardio
      POSTGRES_PASSWORD: cardio
      POSTGRES_DB: cardio_eval
    ports:
      - "5432:5432"
    volumes:
      - cardio_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  app:
    build: .
    environment:
      PORT: 5173
      DATABASE_URL: postgres://cardio:cardio@postgres:5432/cardio_eval
    ports:
      - "5173:5173"
    depends_on:
      - postgres

volumes:
  cardio_postgres_data:
